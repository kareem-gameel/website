<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Delta learning workflow</title>
  <desc id="desc">A molecular representation is used to calculate a physical baseline and a reference target. Their difference defines a residual learned by a machine-learning model. The predicted residual is added to the baseline to produce the final prediction.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#335d5d"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #9eb2af; stroke-width: 2.5; }
      .baseline { fill: #edf5f3; stroke: #4f8581; }
      .reference { fill: #fff3ef; stroke: #ce6b52; }
      .residual { fill: #f4f1f7; stroke: #746b91; }
      .prediction { fill: #eef5f4; stroke: #235a59; }
      .line { fill: none; stroke: #335d5d; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #78908e; stroke-width: 2.5; }
      .title { fill: #173335; font: 700 25px Arial, sans-serif; text-anchor: middle; }
      .detail { fill: #536766; font: 18px Arial, sans-serif; text-anchor: middle; }
      .formula { fill: #173335; font: 700 27px Georgia, serif; text-anchor: middle; }
      .atom { stroke: #fff; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#f8fbfa"/>

  <g aria-label="Molecular input">
    <rect class="box" x="42" y="205" width="190" height="210" rx="12"/>
    <line x1="105" y1="270" x2="166" y2="315" stroke="#526765" stroke-width="8"/>
    <line x1="166" y1="315" x2="111" y2="365" stroke="#526765" stroke-width="8"/>
    <line x1="166" y1="315" x2="205" y2="260" stroke="#526765" stroke-width="8"/>
    <circle class="atom" cx="105" cy="270" r="22" fill="#4fb7bd"/>
    <circle class="atom" cx="166" cy="315" r="25" fill="#315c5e"/>
    <circle class="atom" cx="111" cy="365" r="21" fill="#ce6b52"/>
    <circle class="atom" cx="205" cy="260" r="18" fill="#4fb7bd"/>
    <text class="title" x="137" y="455">Molecular input</text>
    <text class="detail" x="137" y="486">representation x</text>
  </g>

  <path class="branch" d="M232 310 H276 V145 H314"/>
  <path class="branch" d="M276 310 V465 H314"/>

  <g aria-label="Reference target">
    <rect class="box reference" x="314" y="65" width="260" height="160" rx="12"/>
    <text class="title" x="444" y="118">Reference target</text>
    <text class="formula" x="444" y="162">y<tspan baseline-shift="sub" font-size="18">ref</tspan></text>
    <text class="detail" x="444" y="198">high-fidelity calculation</text>
  </g>

  <g aria-label="Physical baseline">
    <rect class="box baseline" x="314" y="395" width="260" height="160" rx="12"/>
    <text class="title" x="444" y="448">Physical baseline</text>
    <text class="formula" x="444" y="492">y<tspan baseline-shift="sub" font-size="18">base</tspan></text>
    <text class="detail" x="444" y="528">low-cost calculation</text>
  </g>

  <path class="line" d="M574 145 H642 V252"/>
  <path class="line" d="M574 475 H642 V368"/>

  <g aria-label="Residual target">
    <rect class="box residual" x="642" y="225" width="250" height="170" rx="12"/>
    <text class="title" x="767" y="275">Residual target</text>
    <text class="formula" x="767" y="324">Δy = y<tspan baseline-shift="sub" font-size="18">ref</tspan> − y<tspan baseline-shift="sub" font-size="18">base</tspan></text>
    <text class="detail" x="767" y="365">learn the correction</text>
  </g>

  <path class="line" d="M892 310 H934"/>

  <g aria-label="Machine learning correction">
    <rect class="box residual" x="934" y="225" width="224" height="170" rx="12"/>
    <text class="title" x="1046" y="273">ML model</text>
    <text class="formula" x="1046" y="322">Δŷ(x)</text>
    <text class="detail" x="1046" y="364">predicted correction</text>
  </g>

  <path class="line" d="M1046 395 V463 H940"/>
  <path class="branch" d="M574 475 H820 V510 H940"/>

  <g aria-label="Final prediction">
    <rect class="box prediction" x="940" y="443" width="218" height="132" rx="12"/>
    <text class="title" x="1049" y="490">Final prediction</text>
    <text class="formula" x="1049" y="535">ŷ = y<tspan baseline-shift="sub" font-size="18">base</tspan> + Δŷ</text>
  </g>
</svg>
