<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102b2e">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=https://kareem-gameel.github.io/">
    <link rel="canonical" href="https://kareem-gameel.github.io/">
    <title>Portfolio moved | Kareem Abdel-Hafez</title>
    <style>
      * { box-sizing: border-box; letter-spacing: 0; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #ffffff;
        background: #102b2e;
        border-right: 8px solid #d46149;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main { width: min(calc(100% - 40px), 680px); }
      p { color: #c8d9d7; line-height: 1.7; }
      h1 {
        margin: 0 0 16px;
        font-family: Georgia, Cambria, "Times New Roman", serif;
        font-size: clamp(2.4rem, 8vw, 4.5rem);
        line-height: 1.05;
      }
      a { color: #ffffff; font-weight: 750; text-underline-offset: 4px; }
    </style>
    <script>
      const destination = new URL("https://kareem-gameel.github.io/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
  </head>
  <body>
    <main>
      <p>Kareem Abdel-Hafez · Research Portfolio</p>
      <h1>The website has moved.</h1>
      <p>
        Continue to <a href="https://kareem-gameel.github.io/">kareem-gameel.github.io</a>.
      </p>
    </main>
  </body>
</html>
